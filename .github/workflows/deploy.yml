name: Build and Deploy Spring Boot App to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: springboot-app
  ECS_CLUSTER: springboot-cluster
  ECS_SERVICE: springboot-ecs-alb-ECSService-RtmMX5V66GL6
  TASK_FAMILY: springboot-ecs-alb-TaskDefinition-DcuaqBn1xSBY
  CONTAINER_NAME: springboot-container

jobs:
  deploy:
    name: Build, Test, Scan and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests and Verify
        run: mvn verify

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=springboot-app-nadia \
            -Dsonar.projectName="springboot-app-nadia" \
            -Dsonar.host.url=https://sonarqube.hlsgroup.com.mx \
            -Dsonar.token=$SONAR_TOKEN

      - name: Check SonarQube Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Waiting 10s for SonarQube to process analysis..."
          sleep 10

          STATUS=$(curl -s -u $SONAR_TOKEN: \
            "https://sonarqube.hlsgroup.com.mx/api/qualitygates/project_status?projectKey=springboot-app-nadia" \
            | jq -r '.projectStatus.status')

          echo "Quality Gate Status: $STATUS"

          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate failed. Stopping deployment."
            exit 1
          fi
      # Login to AWS with OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::058264329693:role/GitHubActionsOIDC
          aws-region: ${{ env.AWS_REGION }}

      # Get Account ID
      - name: Get AWS Account ID
        id: login
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "REGISTRY=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com" >> $GITHUB_ENV

      # Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $REGISTRY

      # Build, Tag and Push Docker image
      - name: Build and Push Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:latest .
          docker tag $ECR_REPOSITORY:latest $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      # Deploy to ECS (force new deployment)
      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION